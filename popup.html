<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioTube</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><span class="logo">♫</span><div><h1>AudioTube</h1><p data-i18n="tagline">Menos pantalla. Más escucha.</p></div></header>
<p id="notice" class="notice" data-i18n="youtubeNotice" hidden>Abre un vídeo de YouTube para usar AudioTube.</p>
<section id="controls">
  <label class="hero"><span><strong data-i18n="audioOnly">Solo audio</strong><small data-i18n="audioOnlyHelp">Reproductor compacto y vídeo oculto</small></span><input id="audioMode" type="checkbox"><i></i></label>
  <div class="block"><label for="profile" data-i18n="profile">Perfil</label><select id="profile"><option value="custom" data-i18n="custom">Personalizado</option><option value="music" data-i18n="music">Música</option><option value="podcast" data-i18n="podcast">Podcast</option><option value="focus" data-i18n="focus">Concentración</option><option value="sleep" data-i18n="sleep30">Sueño · 30 min</option></select></div>
  <div class="playback"><button id="back">−15</button><button id="playbackHint" data-i18n="playerControls" disabled>Controles en el reproductor</button><button id="forward">+15</button><label><span data-i18n="speed">Velocidad</span><select id="rate"><option>.75×</option><option selected>1×</option><option>1.25×</option><option>1.5×</option><option>1.75×</option><option>2×</option></select></label></div>
  <div class="timer"><div><strong data-i18n="timer">Temporizador</strong><label class="fade"><input id="fade" type="checkbox"> <span data-i18n="fadeVolume">Desvanecer volumen</span></label></div><select id="timer"><option value="off" data-i18n="off">Desactivado</option><option value="15" data-i18n="minutes15">15 minutos</option><option value="30" data-i18n="minutes30">30 minutos</option><option value="60" data-i18n="minutes60">60 minutos</option><option value="end-video" data-i18n="endVideo">Al terminar el vídeo</option><option value="end-playlist" data-i18n="endPlaylist">Al terminar la lista</option></select><small id="timerStatus" data-i18n="noTimer">Sin temporizador activo</small><button id="addTime" data-i18n="addTen" hidden>+10 min</button></div>
  <details><summary data-i18n="preferences">Preferencias</summary><div class="options"><label><span data-i18n="autoEnable">Activar automáticamente</span><input id="autoEnable" type="checkbox"></label><label><span data-i18n="smartQuality">Calidad mínima inteligente</span><input id="smartQuality" type="checkbox"></label><label><span data-i18n="rememberSpeed">Recordar velocidad por canal</span><input id="rememberSpeed" type="checkbox"></label><label><span data-i18n="hideThumbnails">Ocultar miniaturas</span><input id="hideThumbnails" type="checkbox"></label><label><span data-i18n="focusMode">Modo concentración</span><input id="focusMode" type="checkbox"></label><label><span data-i18n="quickSkip">Salto rápido</span><select id="skipSeconds"><option value="10">10 s</option><option value="15">15 s</option><option value="30">30 s</option></select></label></div></details>
</section><footer><span><span id="shortcut"><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd></span> <span data-i18n="focusShortcut">Concentración</span></span></footer></main><script src="popup.js"></script></body></html>
